<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="stylesheet" href="style.css">
    <title>Simple Basketball Scoreboard</title>
</head>
<body>
    <main class="Scoreboard">
        <section class="team">
            <h2>HOME</h2>
            <p id="home-score">0</p>
            <div class="buttons">
                <button onclick="scoreHome(1)">+ 1</button>
                <button onclick="scoreHome(2)">+ 2</button>
                <button onclick="scoreHome(3)">+ 3</button>
            </div>
        </section>

        <section class="game">
            <div class="timer">
                <p id="timer">10:00</p>
                <button onclick="resetScore()">RESET</button>
            </div>
        </section>

        <section class="team">
            <h2>GUEST</h2>
            <p id="guest-score">0</p>
            <div class="buttons">
                <button onclick="scoreGuest(1)">+ 1</button>
                <button onclick="scoreGuest(2)">+ 2</button>
                <button onclick="scoreGuest(3)">+ 3</button>
            </div>
        </section>
    </main>
    <script src="script.js"></script>
</body>
</html>
